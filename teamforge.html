<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Сработаемся — найди команду для своей идеи</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap">
<style>
:root{--bg:#F5F6F2;--card:#fff;--ink:#14201D;--mut:#5D6B67;--line:#E1E5DF;--ac:#0E7C66;--acf:#fff;--hi:#F2B33D;--sh:0 1px 2px rgba(20,32,29,.06),0 8px 24px -12px rgba(20,32,29,.18);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0E1513;--card:#16201D;--ink:#EAF0ED;--mut:#93A39D;--line:#25332F;--ac:#3DC9A6;--acf:#08110E;--sh:0 8px 24px -12px #000}}
:root[data-theme=dark]{--bg:#0E1513;--card:#16201D;--ink:#EAF0ED;--mut:#93A39D;--line:#25332F;--ac:#3DC9A6;--acf:#08110E;--sh:0 8px 24px -12px #000}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.55 Manrope,system-ui,sans-serif}
a{color:inherit;text-decoration:none}h1,h2,h3{margin:0;line-height:1.15;letter-spacing:-.02em}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{max-width:1100px;margin:auto;padding:12px 16px;display:flex;align-items:center;gap:14px}
.logo{font-weight:800;font-size:18px}.logo i{display:inline-block;width:12px;height:12px;border-radius:4px;background:var(--hi);margin-right:6px}
nav{display:flex;gap:4px;flex:1;overflow-x:auto}nav a{padding:7px 12px;border-radius:99px;color:var(--mut);font-weight:600;white-space:nowrap}nav a.on,nav a:hover{background:var(--card);color:var(--ink)}
main{max-width:1100px;margin:auto;padding:24px 16px 80px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:10px 16px;border-radius:12px;font:600 14px Manrope,sans-serif;cursor:pointer}
.btn.p{background:var(--ac);color:var(--acf);border-color:var(--ac)}.btn.s{padding:6px 12px;font-size:13px}.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.hero{padding:48px 0 32px}.hero h1{font-size:clamp(34px,7vw,64px);font-weight:800;max-width:14ch}.hero p{color:var(--mut);font-size:18px;max-width:46ch;margin:16px 0 24px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--sh)}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;background:color-mix(in srgb,var(--ac) 12%,transparent);color:var(--ac);margin:0 4px 4px 0}
.mut{color:var(--mut);font-size:13px}.av{width:40px;height:40px;border-radius:50%;background:var(--ac);color:var(--acf);display:grid;place-items:center;font-weight:800;flex:none}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:24px 0}.steps .card b{color:var(--ac)}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;margin:4px 0 12px}
label{font-weight:600;font-size:13px}.form{max-width:560px}
.filters{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:10px}@media(max-width:700px){.filters{grid-template-columns:1fr 1fr}.filters input{grid-column:1/-1}}
.chat{height:320px;overflow:auto;display:flex;flex-direction:column;gap:8px;padding:8px}.msg{background:var(--bg);border-radius:12px;padding:8px 12px;max-width:80%}.msg.me{align-self:flex-end;background:color-mix(in srgb,var(--ac) 18%,var(--bg))}.msg.sys{align-self:center;font-size:12px;color:var(--mut)}
.badge{background:var(--hi);color:#14201D;border-radius:99px;font-size:11px;font-weight:800;padding:1px 7px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9}#toast.on{opacity:1}
dialog{border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--ink);max-width:480px;width:calc(100% - 32px)}
.empty{text-align:center;padding:40px;color:var(--mut)}h2{margin:28px 0 12px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<header><div class="bar"><a class="logo" href="#/"><i></i>Сработаемся</a><nav id="nav"></nav><button class="btn s" id="th" aria-label="Тема">◐</button></div></header>
<main id="app"></main><dialog id="dlg"></dialog><div id="toast" role="status"></div>
<script>
const $=s=>document.querySelector(s),K='sr_v1';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9),now=()=>Date.now();
const ago=t=>{const m=Math.round((now()-t)/6e4);return m<1?'только что':m<60?m+' мин назад':m<1440?Math.round(m/60)+' ч назад':Math.round(m/1440)+' дн назад'};
async function hash(p){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('sr:'+p));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
let db;function save(){try{localStorage.setItem(K,JSON.stringify(db))}catch(e){}}
async function init(){try{db=JSON.parse(localStorage.getItem(K))}catch(e){}
 if(!db){const h=await hash('demo1234');const U=(n,u,r,s,b)=>({id:u,name:n,username:u,email:u+'@demo.ru',pass:h,role:r,skills:s,bio:b});
 db={session:null,users:[U('Анна Орлова','anna','UI/UX дизайнер',['Figma','UX'],'Проектирую интерфейсы 5 лет.'),U('Максим Волков','maxim','Frontend Developer',['React','TypeScript'],'Люблю аккуратный код и быстрые интерфейсы.'),U('Илья Ким','ilya','Backend Developer',['Node.js','PostgreSQL'],'API, базы данных, безопасность.'),U('Дарья Лис','darya','Product Manager',['Roadmap','Agile'],'Превращаю идеи в продукты.'),U('Егор Мор','egor','Mobile Developer',['Flutter','Swift'],'Мобильные приложения с нуля.'),U('Вера Нова','vera','Marketing Specialist',['SEO','SMM'],'Запускаю продукты на рынок.')],
 projects:[],apps:[],members:[],msgs:[],notifs:[],invites:[]};
 const P=(t,d,c,sk,roles,f,pay,by)=>{const id=uid();db.projects.push({id,title:t,desc:d,cat:c,skills:sk,roles,format:f,pay,level:'Средний',by,created:now()-Math.random()*6e5*100,status:'open'});db.members.push({pid:id,uid:by,role:'Создатель'});db.msgs.push({pid:id,sys:1,text:'Команда создана',t:now()})};
 P('Создание мобильного приложения','Приложение для поиска спортивных мероприятий рядом.','Мобильная разработка',['Flutter','Figma'],[{n:'UI/UX Designer',c:1},{n:'Flutter Developer',c:2},{n:'Backend Developer',c:1}],'Удалённо','Обсуждается','darya');
 P('AI-платформа для обучения','Персональные учебные планы на основе ИИ.','AI',['Python','React'],[{n:'Frontend Developer',c:1},{n:'Backend Developer',c:1}],'Удалённо','Фиксированная','ilya');
 P('Онлайн-магазин одежды','Магазин локального бренда с нуля.','E-commerce',['React','SEO'],[{n:'Frontend Developer',c:1},{n:'Marketing Specialist',c:1}],'Гибрид','Бесплатно','anna');
 P('Игровой проект','2D-платформер в стиле пиксель-арт.','Игры',['Unity','Pixel art'],[{n:'Game Developer',c:2},{n:'Artist',c:1}],'Удалённо','Бесплатно','maxim');
 P('Сервис поиска мероприятий','Афиша и подбор событий по интересам.','Веб',['Node.js','UX'],[{n:'Backend Developer',c:1},{n:'UI/UX Designer',c:1}],'Удалённо','Почасовая','egor');save()}}
const me=()=>db.users.find(u=>u.id===db.session),U=id=>db.users.find(u=>u.id===id)||{name:'?',username:'?',skills:[]},P=id=>db.projects.find(p=>p.id===id);
const av=u=>`<div class="av">${esc((u.name||'?')[0])}</div>`;
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),2200)}
function notify(to,text,link){db.notifs.push({id:uid(),to,text,link,t:now(),read:0})}
const seats=p=>p.roles.reduce((a,r)=>a+r.c,0),taken=p=>db.members.filter(m=>m.pid===p.id&&m.role!=='Создатель').length;
function dlg(html){const d=$('#dlg');d.innerHTML=html;d.showModal()}
function nav(){const u=me(),h=location.hash||'#/',n=db.notifs.filter(x=>x.to===db.session&&!x.read).length;
 const L=[['#/projects','Проекты'],['#/people','Люди']];if(u)L.push(['#/dashboard','Кабинет'+(n?` <span class="badge">${n}</span>`:'')],['#/create','+ Проект']);
 $('#nav').innerHTML=L.map(([a,t])=>`<a href="${a}" class="${h.startsWith(a)?'on':''}">${t}</a>`).join('')+(u?`<a href="#" onclick="logout()">Выйти</a>`:`<a href="#/login">Войти</a>`)}
function logout(){db.session=null;save();location.hash='#/';route()}
const V={};
V.home=()=>`<section class="hero"><h1>Найди команду для своей идеи</h1><p>Создавай проекты, находи специалистов и собирай команду для совместной работы.</p><div class="row"><a class="btn p" href="#/projects">Найти проект</a><a class="btn" href="#/create">Создать проект</a>${me()?'':'<a class="btn" href="#/register">Зарегистрироваться</a>'}</div></section>
<div class="steps">${[['Создай проект','Опиши задачу и нужные роли'],['Найди участников','Люди сами присылают заявки'],['Собери команду','Прими подходящих кандидатов'],['Работайте вместе','Общайтесь в командном чате']].map(([a,b],i)=>`<div class="card"><b>${i+1}</b><h3>${a}</h3><p class="mut">${b}</p></div>`).join('')}</div>
<h2>Свежие проекты</h2><div class="grid">${db.projects.slice(-3).reverse().map(pc).join('')}</div>`;
const pc=p=>`<a class="card" href="#/project/${p.id}" style="display:block"><span class="tag">${esc(p.cat)}</span><h3>${esc(p.title)}</h3><p class="mut">${esc(p.desc)}</p><div>${p.skills.map(s=>`<span class="tag">${esc(s)}</span>`).join('')}</div><p class="mut">${esc(p.format)} · ${esc(p.pay)} · мест: ${Math.max(0,seats(p)-taken(p))}/${seats(p)}<br>${esc(U(p.by).name)} · ${ago(p.created)}${p.status==='closed'?' · закрыт':''}</p></a>`;
let F={q:'',cat:'',fmt:'',sort:'new'};
V.projects=()=>{const cats=[...new Set(db.projects.map(p=>p.cat))];
 return`<h2 style="margin-top:0">Проекты</h2><div class="filters"><input id="fq" placeholder="Поиск по названию и описанию" value="${esc(F.q)}"><select id="fc"><option value="">Все категории</option>${cats.map(c=>`<option ${F.cat===c?'selected':''}>${esc(c)}</option>`).join('')}</select><select id="ff"><option value="">Любой формат</option>${['Удалённо','Офлайн','Гибрид'].map(c=>`<option ${F.fmt===c?'selected':''}>${c}</option>`).join('')}</select><select id="fs"><option value="new">Новые</option><option value="pop" ${F.sort==='pop'?'selected':''}>Популярные</option></select></div><div class="grid" id="pl"></div>`};
function plist(){let l=db.projects.filter(p=>(!F.q||(p.title+p.desc).toLowerCase().includes(F.q.toLowerCase()))&&(!F.cat||p.cat===F.cat)&&(!F.fmt||p.format===F.fmt));
 l.sort((a,b)=>F.sort==='pop'?db.apps.filter(x=>x.pid===b.id).length-db.apps.filter(x=>x.pid===a.id).length:b.created-a.created);
 $('#pl').innerHTML=l.map(pc).join('')||'<div class="empty">Ничего не найдено. Измените фильтры или создайте свой проект.</div>'}
V.project=id=>{const p=P(id);if(!p)return'<div class="empty">Проект не найден</div>';const u=me(),mem=db.members.filter(m=>m.pid===id),isM=u&&mem.some(m=>m.uid===u.id),own=u&&p.by===u.id,ap=u&&db.apps.find(a=>a.pid===id&&a.uid===u.id);
 let btn=own?'':isM?'<span class="tag">Вы участник проекта</span>':ap?`<button class="btn" disabled>Заявка отправлена</button>`:`<button class="btn p" onclick="applyDlg('${id}')">Подать заявку</button>`;
 const cand=own?db.apps.filter(a=>a.pid===id&&a.status==='pending'):[];
 return`<span class="tag">${esc(p.cat)}</span><h1>${esc(p.title)}</h1><p class="mut">${esc(p.desc)}</p><div class="row">${btn}${isM?`<a class="btn p" href="#/team/${id}">Открыть команду</a>`:''}${own&&p.status==='open'?`<button class="btn" onclick="closeP('${id}')">Закрыть проект</button>`:''}</div>
<h2>Нужны специалисты</h2><div class="grid">${p.roles.map(r=>`<div class="card"><b>${esc(r.n)}</b><div class="mut">${r.c} чел.</div></div>`).join('')}</div>
<h2>Команда</h2><div class="grid">${mem.map(m=>{const x=U(m.uid);return`<a class="card row" href="#/profile/${x.username}">${av(x)}<div><b>${esc(x.name)}</b><div class="mut">${esc(m.role)}</div></div></a>`}).join('')}</div>
<p class="mut">${esc(p.format)} · ${esc(p.pay)} · ${esc(p.level)}</p>
${own?`<h2>Кандидаты</h2>${cand.map(a=>{const x=U(a.uid);return`<div class="card" style="margin-bottom:10px"><div class="row">${av(x)}<div><b>${esc(x.name)}</b> <span class="mut">${esc(x.role)} · роль: ${esc(a.role)}</span></div></div><p>${esc(a.msg)}</p><div>${(x.skills||[]).map(s=>`<span class="tag">${esc(s)}</span>`).join('')}</div><div class="row"><button class="btn p s" onclick="decide('${a.id}',1)">Принять</button><button class="btn s" onclick="decide('${a.id}',0)">Отклонить</button><a class="btn s" href="#/profile/${x.username}">Открыть профиль</a></div></div>`}).join('')||'<div class="empty">Заявок пока нет</div>'}`:''}`};
function applyDlg(id){if(!me()){toast('Сначала войдите');location.hash='#/login';return}const p=P(id);
 dlg(`<form method="dialog" onsubmit="event.preventDefault();sendApp('${id}',this)"><h3>Заявка на «${esc(p.title)}»</h3><br><label>Роль<select name="role">${p.roles.map(r=>`<option>${esc(r.n)}</option>`).join('')}</select></label><label>Почему вы подходите проекту<textarea name="msg" rows="4" required minlength="10"></textarea></label><label>Ссылка на портфолио<input name="link"></label><div class="row"><button class="btn p">Отправить заявку</button><button type="button" class="btn" onclick="$('#dlg').close()">Отмена</button></div></form>`)}
function sendApp(pid,f){const d=new FormData(f),p=P(pid);db.apps.push({id:uid(),pid,uid:db.session,role:d.get('role'),msg:d.get('msg')+(d.get('link')?' '+d.get('link'):''),status:'pending',t:now()});notify(p.by,`Новая заявка на проект «${p.title}»`,'#/project/'+pid);save();$('#dlg').close();toast('Заявка отправлена');route()}
function decide(id,ok){const a=db.apps.find(x=>x.id===id),p=P(a.pid);a.status=ok?'accepted':'rejected';
 if(ok){db.members.push({pid:p.id,uid:a.uid,role:a.role});db.msgs.push({pid:p.id,sys:1,text:U(a.uid).name+' присоединился к команде',t:now()});notify(a.uid,`Ваша заявка на «${p.title}» принята`,'#/team/'+p.id)}else notify(a.uid,`Заявка на «${p.title}» отклонена`,'#/project/'+p.id);save();toast(ok?'Участник добавлен в команду':'Заявка отклонена');route()}
function closeP(id){P(id).status='closed';save();toast('Проект закрыт');route()}
V.create=()=>{if(!me())return authWall();return`<h2 style="margin-top:0">Создать проект</h2><form class="form" onsubmit="event.preventDefault();mk(this)"><label>Название<input name="title" required minlength="4"></label><label>Краткое описание<textarea name="desc" rows="3" required></textarea></label><label>Категория<input name="cat" required placeholder="Например: Веб"></label><label>Навыки через запятую<input name="skills"></label><label>Нужные роли: «Роль:количество», через запятую<input name="roles" required placeholder="Designer:1, Developer:2"></label><label>Формат<select name="format"><option>Удалённо</option><option>Офлайн</option><option>Гибрид</option></select></label><label>Оплата<select name="pay"><option>Бесплатно</option><option>Фиксированная</option><option>Почасовая</option><option>Обсуждается</option></select></label><button class="btn p">Опубликовать проект</button></form>`};
function mk(f){const d=Object.fromEntries(new FormData(f)),roles=d.roles.split(',').map(s=>{const[n,c]=s.split(':');return{n:n.trim(),c:parseInt(c)||1}}).filter(r=>r.n);const id=uid();
 db.projects.push({id,title:d.title,desc:d.desc,cat:d.cat,skills:d.skills.split(',').map(s=>s.trim()).filter(Boolean),roles,format:d.format,pay:d.pay,level:'Средний',by:db.session,created:now(),status:'open'});db.members.push({pid:id,uid:db.session,role:'Создатель'});db.msgs.push({pid:id,sys:1,text:'Команда создана',t:now()});save();toast('Проект опубликован');location.hash='#/project/'+id}
const authWall=()=>`<div class="empty"><p>Чтобы продолжить, войдите в аккаунт.</p><a class="btn p" href="#/login">Войти</a> <a class="btn" href="#/register">Регистрация</a></div>`;
V.login=()=>`<h2 style="margin-top:0">Вход</h2><form class="form" onsubmit="event.preventDefault();login(this)"><label>Email<input name="email" type="email" required></label><label>Пароль<input name="pass" type="password" required></label><p class="mut" id="err" style="color:#d33"></p><button class="btn p">Войти</button><p class="mut">Демо-доступ: anna@demo.ru / demo1234. Восстановление пароля: сбросить можно только с email-сервером — в демо недоступно.</p></form>`;
async function login(f){const d=new FormData(f),u=db.users.find(x=>x.email===d.get('email').toLowerCase());if(!u||u.pass!==await hash(d.get('pass'))){$('#err').textContent='Неверный email или пароль';return}db.session=u.id;save();location.hash='#/dashboard'}
V.register=()=>`<h2 style="margin-top:0">Регистрация</h2><form class="form" onsubmit="event.preventDefault();reg(this)"><label>Имя<input name="name" required></label><label>Username<input name="username" required pattern="[a-z0-9_]{3,20}" title="3–20 символов: a-z, 0-9, _"></label><label>Email<input name="email" type="email" required></label><label>Пароль (от 8 символов)<input name="pass" type="password" required minlength="8"></label><label>Профессия<input name="role" required></label><label>Навыки через запятую<input name="skills"></label><label>О себе<textarea name="bio" rows="3"></textarea></label><p class="mut" id="err" style="color:#d33"></p><button class="btn p">Создать аккаунт</button></form>`;
async function reg(f){const d=Object.fromEntries(new FormData(f));if(db.users.some(u=>u.email===d.email.toLowerCase()||u.username===d.username)){$('#err').textContent='Такой email или username уже занят';return}
 db.users.push({id:d.username,name:d.name,username:d.username,email:d.email.toLowerCase(),pass:await hash(d.pass),role:d.role,skills:d.skills.split(',').map(s=>s.trim()).filter(Boolean),bio:d.bio});db.session=d.username;save();toast('Добро пожаловать!');location.hash='#/dashboard'}
V.profile=un=>{const x=db.users.find(u=>u.username===un);if(!x)return'<div class="empty">Пользователь не найден</div>';const mine=db.projects.filter(p=>p.by===db.session&&p.status==='open');
 return`<div class="row">${av(x)}<div><h1>${esc(x.name)}</h1><div class="mut">@${esc(x.username)} · ${esc(x.role)}</div></div></div><p>${esc(x.bio)}</p><div>${x.skills.map(s=>`<span class="tag">${esc(s)}</span>`).join('')}</div><h2>Проекты</h2><div class="grid">${db.members.filter(m=>m.uid===x.id).map(m=>P(m.pid)).filter(Boolean).map(pc).join('')||'<div class="empty">Пока нет проектов</div>'}</div>${mine.length&&x.id!==db.session?`<p><button class="btn p" onclick="inviteDlg('${x.id}')">Пригласить в проект</button></p>`:''}`};
V.people=()=>`<h2 style="margin-top:0">Люди</h2><div class="filters"><input id="pq" placeholder="Профессия или навык"></div><div class="grid" id="ppl"></div>`;
function plist2(){const q=($('#pq').value||'').toLowerCase();$('#ppl').innerHTML=db.users.filter(u=>!q||(u.role+u.skills.join()).toLowerCase().includes(q)).map(u=>`<div class="card"><div class="row">${av(u)}<div><b><a href="#/profile/${u.username}">${esc(u.name)}</a></b><div class="mut">${esc(u.role)}</div></div></div><p class="mut">${esc(u.bio)}</p>${u.skills.map(s=>`<span class="tag">${esc(s)}</span>`).join('')}${db.session&&u.id!==db.session?`<p><button class="btn s" onclick="inviteDlg('${u.id}')">Пригласить в проект</button></p>`:''}</div>`).join('')||'<div class="empty">Никого не нашли</div>'}
function inviteDlg(to){if(!me()){location.hash='#/login';return}const m=db.projects.filter(p=>p.by===db.session&&p.status==='open');if(!m.length){toast('Сначала создайте проект');return}
 dlg(`<h3>Пригласить в проект</h3><br><select id="ip">${m.map(p=>`<option value="${p.id}">${esc(p.title)}</option>`).join('')}</select><div class="row"><button class="btn p" onclick="inv('${to}')">Отправить приглашение</button><button class="btn" onclick="$('#dlg').close()">Отмена</button></div>`)}
function inv(to){const pid=$('#ip').value;db.invites.push({id:uid(),pid,to,status:'pending'});notify(to,`Вас пригласили присоединиться к «${P(pid).title}»`,'#/dashboard');save();$('#dlg').close();toast('Приглашение отправлено')}
function invAns(id,ok){const i=db.invites.find(x=>x.id===id);i.status=ok?'accepted':'rejected';if(ok){db.members.push({pid:i.pid,uid:i.to,role:'Участник'});db.msgs.push({pid:i.pid,sys:1,text:U(i.to).name+' присоединился к команде',t:now()});notify(P(i.pid).by,`${U(i.to).name} принял приглашение`,'#/team/'+i.pid)}save();route()}
V.dashboard=()=>{if(!me())return authWall();const u=me(),ns=db.notifs.filter(n=>n.to===u.id).sort((a,b)=>b.t-a.t),st={pending:'На рассмотрении',accepted:'Принята',rejected:'Отклонена'};ns.forEach(n=>n.read=1);const unread=0;
 const html=`<h2 style="margin-top:0">Привет, ${esc(u.name.split(' ')[0])}</h2>
<h2>Приглашения</h2>${db.invites.filter(i=>i.to===u.id&&i.status==='pending').map(i=>`<div class="card row" style="margin-bottom:8px"><span style="flex:1">Вас пригласили присоединиться к «${esc(P(i.pid).title)}»</span><button class="btn p s" onclick="invAns('${i.id}',1)">Принять</button><button class="btn s" onclick="invAns('${i.id}',0)">Отклонить</button></div>`).join('')||'<p class="mut">Нет новых приглашений</p>'}
<h2>Мои команды</h2><div class="grid">${db.members.filter(m=>m.uid===u.id).map(m=>`<a class="card" href="#/team/${m.pid}"><b>${esc(P(m.pid).title)}</b><div class="mut">${esc(m.role)}</div></a>`).join('')||'<div class="empty">Вы пока не в команде. <a href="#/projects" style="color:var(--ac)">Найдите проект</a></div>'}</div>
<h2>Мои проекты</h2><div class="grid">${db.projects.filter(p=>p.by===u.id).map(p=>`<a class="card" href="#/project/${p.id}"><b>${esc(p.title)}</b><div class="mut">${p.status==='open'?'Открыт':'Закрыт'} · участников: ${db.members.filter(m=>m.pid===p.id).length} · заявок: ${db.apps.filter(a=>a.pid===p.id).length}</div></a>`).join('')||'<div class="empty">Вы ещё не создавали проектов</div>'}</div>
<h2>Мои заявки</h2>${db.apps.filter(a=>a.uid===u.id).map(a=>`<div class="card row" style="margin-bottom:8px"><a href="#/project/${a.pid}" style="flex:1"><b>${esc(P(a.pid).title)}</b> <span class="mut">${ago(a.t)}</span></a><span class="tag">${st[a.status]}</span></div>`).join('')||'<p class="mut">Заявок пока нет</p>'}
<h2>Уведомления</h2>${ns.map(n=>`<a class="card" style="display:block;margin-bottom:8px" href="${n.link||'#'}">${esc(n.text)} <span class="mut">· ${ago(n.t)}</span></a>`).join('')||'<p class="mut">Уведомлений нет</p>'}`;save();return html};
V.team=id=>{const p=P(id),u=me();if(!u||!p||!db.members.some(m=>m.pid===id&&m.uid===u.id))return'<div class="empty">Чат доступен только участникам команды</div>';
 return`<h2 style="margin-top:0">${esc(p.title)}</h2><p class="mut">${db.members.filter(m=>m.pid===id).map(m=>esc(U(m.uid).name)+' — '+esc(m.role)).join(' · ')}</p><div class="card"><div class="chat" id="chat"></div><form class="row" onsubmit="event.preventDefault();send('${id}',this)"><input name="t" placeholder="Сообщение" required autocomplete="off" style="flex:1;margin:0"><button class="btn p">Отправить</button></form></div>`};
function chat(id){const c=$('#chat');if(!c)return;c.innerHTML=db.msgs.filter(m=>m.pid===id).map(m=>m.sys?`<div class="msg sys">${esc(m.text)}</div>`:`<div class="msg ${m.uid===db.session?'me':''}"><b>${esc(U(m.uid).name)}</b> <span class="mut">${new Date(m.t).toLocaleTimeString('ru',{hour:'2-digit',minute:'2-digit'})}</span><br>${esc(m.text)}</div>`).join('');c.scrollTop=1e9}
function send(id,f){const t=new FormData(f).get('t').trim();if(!t)return;db.msgs.push({pid:id,uid:db.session,text:t,t:now()});db.members.filter(m=>m.pid===id&&m.uid!==db.session).forEach(m=>notify(m.uid,`Новое сообщение в «${P(id).title}»`,'#/team/'+id));save();f.reset();chat(id)}
function route(){const h=(location.hash||'#/').slice(2).split('/'),k=h[0]||'home',fn=V[k]||V.home;$('#app').innerHTML=fn(h[1]);nav();
 if(k==='projects'){plist();$('#fq').oninput=e=>{F.q=e.target.value;plist()};$('#fc').onchange=e=>{F.cat=e.target.value;plist()};$('#ff').onchange=e=>{F.fmt=e.target.value;plist()};$('#fs').onchange=e=>{F.sort=e.target.value;plist()}}
 if(k==='people'){plist2();$('#pq').oninput=plist2}if(k==='team')chat(h[1]);window.scrollTo(0,0)}
$('#th').onclick=()=>{const r=document.documentElement,d=(r.dataset.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'))==='dark';r.dataset.theme=d?'light':'dark'};
addEventListener('hashchange',route);init().then(route);
</script></body></html>
